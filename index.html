<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Girlfriend's Day 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff6f8;
    --pink:#ffd1dc;
    --pink-deep:#ff8fab;
    --rose:#ff5d8f;
    --rose-dark:#e14577;
    --lav:#e6d7ff;
    --lav-deep:#b79cff;
    --peach:#ffe1c9;
    --text:#4a2c3d;
    --text-soft:#8a6b7a;
    --white:#ffffff;
    --shadow:rgba(255,111,145,0.28);
    --gold:#ffcf6b;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Quicksand',sans-serif;
    color:var(--text);
    background:var(--bg);
  }
  .script{font-family:'Pacifico',cursive;}
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;border:none;}

  /* ---------- INTRO (fixed full-screen "portal" — scroll zooms THROUGH it into the map) ---------- */
  #intro{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;overflow:hidden;
    background:linear-gradient(160deg,var(--pink) 0%,var(--lav) 55%,var(--peach) 100%);
    padding:24px;
    transition:opacity 1.2s cubic-bezier(.4,0,1,1);
  }
  #intro.zoom-exit{opacity:0;pointer-events:none;}
  #introZoom{
    will-change:transform,opacity;
    transition:transform 1.4s cubic-bezier(.6,0,.05,1), opacity 1.2s cubic-bezier(.4,0,1,1);
  }
  #introZoom.zoom-exit{transform:scale(4.2);opacity:0;}
  #zoomFlash{
    position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0;
    background:radial-gradient(circle, #fff 0%, var(--pink) 65%, transparent 100%);
    transition:opacity 0.32s ease;
  }
  .blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:0.5;}
  .blob1{width:280px;height:280px;background:var(--rose);top:-60px;left:-60px;}
  .blob2{width:320px;height:320px;background:var(--lav-deep);bottom:-100px;right:-80px;}
  .heart-float{position:absolute;bottom:-40px;font-size:22px;opacity:0.7;animation:floatUp linear infinite;pointer-events:none;}
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(0deg);opacity:0;}
    10%{opacity:0.8;}
    100%{transform:translateY(-110vh) rotate(25deg);opacity:0;}
  }
  #intro .label{
    letter-spacing:3px;font-size:13px;font-weight:700;color:var(--rose-dark);
    text-transform:uppercase;opacity:0;animation:fadeUp 0.9s ease forwards 0.2s;
  }
  #intro .name{
    font-size:clamp(48px,10vw,88px);
    margin:6px 0 18px;color:var(--rose-dark);
    text-shadow:0 4px 18px var(--shadow);
    opacity:0;animation:fadeUp 0.9s ease forwards 0.5s;
  }
  #intro .line{
    font-size:clamp(20px,3.6vw,32px);font-weight:600;max-width:680px;margin:6px 0;
    opacity:0;animation:fadeUp 0.9s ease forwards;
  }
  #intro .line1{animation-delay:1.3s;}
  #intro .line2{animation-delay:2.3s;color:var(--rose-dark);font-weight:700;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
  #scrollCue{
    position:absolute;bottom:34px;display:flex;flex-direction:column;align-items:center;gap:6px;
    opacity:0;animation:fadeUp 0.9s ease forwards 3.2s;
    color:var(--text-soft);font-weight:600;font-size:14px;
    background:none;
  }
  #scrollCue .chev{font-size:22px;animation:bounce 1.6s ease-in-out infinite;color:var(--rose);}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(10px);}}

  /* ---------- MAP ---------- */
  #map{
    position:relative;padding:70px 16px 120px;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.6), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(255,255,255,0.5), transparent 40%),
      #fffaf3;
  }
  #map h2{text-align:center;font-size:clamp(22px,4vw,32px);margin:0 0 4px;color:var(--rose-dark);}
  #map .sub{text-align:center;color:var(--text-soft);margin:0 0 40px;font-weight:600;}
  .map-track{position:relative;width:100%;max-width:640px;height:2020px;margin:0 auto;}
  .map-track svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
  .deco{position:absolute;font-size:28px;opacity:0.35;pointer-events:none;}
  .node{
    position:absolute;width:112px;height:112px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:50%;
    background:linear-gradient(160deg,#e3dbe0,#cfc3ca);
    box-shadow:0 6px 14px rgba(0,0,0,0.12) inset, 0 8px 18px rgba(0,0,0,0.08);
    color:#8b818a;
    transition:transform 0.25s ease;
  }
  .node .icon{font-size:34px;filter:grayscale(1);opacity:0.7;}
  .node .lock{font-size:20px;margin-top:2px;}
  .node-label{
    position:absolute;width:180px;text-align:center;top:100%;left:50%;
    transform:translateX(-50%);margin-top:10px;font-weight:700;font-size:14px;color:var(--text-soft);
  }
  .node-label .lvl{display:block;font-size:11px;letter-spacing:2px;color:var(--rose);font-weight:700;}
  .node.unlocked{
    background:linear-gradient(160deg,var(--pink) 0%,var(--rose) 100%);
    box-shadow:0 0 0 6px rgba(255,93,143,0.18), 0 10px 24px var(--shadow);
    cursor:pointer;
    animation:pulse 1.8s ease-in-out infinite;
  }
  .node.unlocked .icon{filter:none;opacity:1;}
  .node.unlocked:hover{transform:scale(1.06);}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 6px rgba(255,93,143,0.18),0 10px 24px var(--shadow);}
    50%{box-shadow:0 0 0 14px rgba(255,93,143,0.08),0 10px 30px var(--shadow);}
  }
  .node.completed{
    background:linear-gradient(160deg,var(--gold),#f0a93f);
    box-shadow:0 8px 20px rgba(240,169,63,0.4);
    cursor:default;
  }
  .node.completed .icon{filter:none;opacity:1;}
  .node.completed::after{
    content:"✓";position:absolute;top:-6px;right:-6px;background:#fff;color:#e0a020;
    border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    font-weight:900;box-shadow:0 3px 8px rgba(0,0,0,0.2);
  }
  .node.final{width:132px;height:132px;}

  /* ---------- AVATAR WALKER (trots to the next level once one is cleared) ---------- */
  .avatar-walker{
    position:absolute;width:56px;height:56px;z-index:6;
    transition:left 1.4s cubic-bezier(.4,0,.2,1), top 1.4s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
  }
  .avatar-walker figure{
    width:100%;height:100%;margin:0;border-radius:50%;overflow:hidden;
    background:linear-gradient(160deg,var(--lav),var(--pink));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 18px rgba(0,0,0,0.25);border:3px solid #fff;
  }
  .avatar-walker figure img{width:100%;height:100%;object-fit:cover;display:block;}
  .avatar-walker figure img.broken{display:none;}
  .avatar-walker figure .ph{color:var(--text-soft);font-size:20px;}
  .avatar-walker.walking{animation:avatarBob 0.4s ease-in-out infinite alternate;}
  @keyframes avatarBob{from{transform:translateY(0);}to{transform:translateY(-8px);}}

  /* ---------- GAME OVERLAY ---------- */
  #gameOverlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(74,44,61,0.55);
    backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;
    padding:16px;
  }
  .game-card{
    background:var(--white);
    border-radius:24px;
    max-width:660px;width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
    overflow:hidden;
  }
  .game-card header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 22px;background:linear-gradient(120deg,var(--pink),var(--lav));
  }
  .game-card header h3{margin:0;font-size:18px;color:var(--rose-dark);}
  .game-card header span{display:block;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--text-soft);}
  #closeGame{
    background:rgba(255,255,255,0.7);border-radius:50%;width:34px;height:34px;
    font-size:16px;font-weight:700;color:var(--text);
  }
  .game-hint{
    text-align:center;font-size:13px;color:var(--text-soft);padding:10px 16px 0;font-weight:600;
  }
  #gameMount{padding:14px 16px 20px;display:flex;flex-direction:column;align-items:center;}
  #gameMount canvas{max-width:100%;height:auto;border-radius:14px;background:#eaf6ff;touch-action:none;}

  /* ---------- UNLOCK MODAL ---------- */
  #unlockModal{
    position:fixed;inset:0;z-index:60;
    background:rgba(74,44,61,0.6);
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  .unlock-card{
    background:linear-gradient(160deg,#fff,#fff8f2);
    border-radius:26px;padding:40px 30px;max-width:420px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
    animation:popIn 0.4s cubic-bezier(.26,1.4,.4,1) both;
  }
  @keyframes popIn{from{transform:scale(0.8);opacity:0;}to{transform:scale(1);opacity:1;}}
  .unlock-card .tag{letter-spacing:3px;font-size:12px;font-weight:700;color:var(--rose);text-transform:uppercase;}
  .unlock-card .big-icon{font-size:64px;margin:14px 0;}
  .unlock-card .qname{font-size:clamp(28px,6vw,38px);color:var(--rose-dark);margin:0 0 14px;}
  .unlock-card p{color:var(--text-soft);font-weight:600;line-height:1.5;margin:0 0 22px;}
  .btn-primary{
    background:linear-gradient(120deg,var(--rose),var(--rose-dark));color:#fff;font-weight:700;
    padding:12px 30px;border-radius:30px;font-size:15px;box-shadow:0 8px 18px var(--shadow);
    transition:transform 0.15s ease;
  }
  .btn-primary:hover{transform:translateY(-2px);}

  /* ---------- FINALE: a zoom-through page deck (heading -> 5 qualities -> closing) ----------
     Each .finale-page is a full-screen fixed page. Only two are ever visible at once, mid-transition:
     the outgoing page zooms toward the viewer and fades (the "passing through" feel), while the
     incoming page grows from small up to full size behind it — a new page revealed INSIDE
     the zoom, not a further scroll below it. Transform+opacity only (no filter/blur) so the
     compositor can run this at a steady 60fps instead of janking. ---------- */
  #finaleDeck{position:fixed;inset:0;z-index:30;display:none;}
  .finale-page{
    position:fixed;inset:0;display:none;
    align-items:center;justify-content:center;text-align:center;
    padding:60px 24px;overflow-y:auto;
    background:linear-gradient(170deg,var(--peach),var(--pink) 45%,var(--lav) 100%);
    will-change:transform,opacity;
    transition:transform 1.3s cubic-bezier(.6,0,.05,1), opacity 1.1s cubic-bezier(.4,0,1,1);
  }
  .finale-page .inner{max-width:600px;margin:auto;}
  .finale-page .inner.wide{max-width:720px;}
  .finale-page h1{font-size:clamp(30px,6vw,50px);color:var(--rose-dark);margin:0 0 16px;}
  .scroll-cue-sm{color:var(--text-soft);font-weight:600;font-size:14px;margin-top:22px;}

  /* quality cards: photo + text side by side (alternating which side per card) so a
     long paragraph + photo actually fits the viewport instead of stacking past it */
  .quality-content{display:flex;align-items:center;gap:28px;text-align:left;}
  .quality-content.reverse{flex-direction:row-reverse;}
  .quality-content .text-col{flex:1;min-width:0;}
  .quality-content .tag{letter-spacing:3px;font-size:12px;font-weight:700;color:var(--rose);text-transform:uppercase;}
  .quality-content .big-icon{font-size:48px;margin:10px 0;}
  .quality-content h2{font-size:clamp(26px,5vw,36px);color:var(--rose-dark);margin:0 0 12px;}
  .quality-content p.note{color:var(--text-soft);font-weight:600;line-height:1.55;font-size:16px;}
  /* the frame hugs each photo's own natural shape instead of forcing every one into
     the same square crop — portrait stays portrait, landscape stays landscape. The
     rounding/shadow live on the image itself so sizing never depends on a fragile
     shrink-to-fit chain through ancestor wrappers. */
  .quality-photo{display:flex;justify-content:center;flex-shrink:0;margin:0;}
  .quality-photo figure{margin:0;}
  .quality-photo figure.placeholder{
    width:180px;height:180px;border-radius:20px;overflow:hidden;
    background:linear-gradient(160deg,var(--lav),var(--pink));
    box-shadow:0 14px 30px rgba(0,0,0,0.18);
    display:flex;align-items:center;justify-content:center;
  }
  .quality-photo img{
    display:block;width:auto;height:auto;
    max-width:min(240px,38vw);max-height:300px;
    border-radius:20px;box-shadow:0 14px 30px rgba(0,0,0,0.18);
  }
  .quality-photo img.broken{display:none;}
  .quality-photo .ph{color:var(--text-soft);font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .quality-photo .ph span:first-child{font-size:30px;}
  @media (max-width:720px){
    .quality-content{flex-direction:column !important;text-align:center;gap:6px;}
    .quality-photo img{max-width:min(280px,70vw);max-height:260px;}
  }
  .finale-page .message{max-width:600px;font-size:17px;line-height:1.7;font-weight:600;color:var(--text);margin-bottom:28px;}
  .confetti-piece{position:fixed;top:-20px;z-index:80;pointer-events:none;font-size:20px;}

  /* ---------- finale: video page ---------- */
  .finale-video{
    width:100%;max-width:440px;border-radius:18px;margin:18px auto 6px;display:block;
    box-shadow:0 16px 34px rgba(0,0,0,0.25);
  }

  /* ---------- finale: the escalating yes/no questions ---------- */
  .question-text{
    font-size:clamp(26px,5.5vw,38px);font-weight:800;color:var(--rose-dark);
    margin:0 0 10px;line-height:1.3;
  }
  .yesno-row{
    position:relative;display:flex;align-items:center;justify-content:center;
    gap:26px;margin-top:34px;height:70px;
  }
  .no-wrap{position:relative;}
  .btn-no{
    background:#fff;color:var(--text-soft);font-weight:700;
    padding:12px 30px;border-radius:30px;font-size:15px;
    border:2px solid #f0e4ea;box-shadow:0 6px 14px rgba(0,0,0,0.1);
    transition:transform 0.15s ease;
  }
  .btn-no:active{transform:scale(0.94);}
  .no-insult{
    position:absolute;bottom:100%;left:50%;
    transform:translate(-50%,0);
    white-space:nowrap;font-weight:800;color:var(--rose-dark);font-size:14px;
    background:#fff;padding:6px 14px;border-radius:16px;
    box-shadow:0 6px 14px rgba(0,0,0,0.15);
    opacity:1;pointer-events:none;
    transition:transform 1.8s ease, opacity 1.8s ease;
  }

  /* ---------- finale: celebration collage ----------
     a Pinterest-style masonry (CSS columns) so every photo keeps its own natural
     shape instead of being cropped into identical tiles ---------- */
  .collage-grid{
    columns:2;column-gap:10px;
    max-width:400px;width:100%;margin:22px auto 0;
  }
  .collage-grid figure{
    margin:0 0 10px;width:100%;display:inline-block;break-inside:avoid;
    border-radius:14px;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,0.15);
  }
  .collage-grid figure.placeholder{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;}
  .collage-grid img{width:100%;height:auto;display:block;}
  .collage-grid img.broken{display:none;}
  .collage-grid .ph{color:var(--text-soft);font-size:11px;font-weight:700;}

  @media (max-width:520px){
    .map-track{height:1900px;}
    .node{width:96px;height:96px;}
    .node.final{width:114px;height:114px;}
  }
</style>
</head>

</section>

<!-- ============ FINALE (zoom-through page deck, built by JS) ============ -->

<!-- ============ GAME OVERLAY ============ -->
<div id="gameOverlay" class="hidden">

</div>

<!-- ============ UNLOCK MODAL ============ -->

</div>

/* =========================================================
   ZOOM-THROUGH TRANSITIONS
   Scrolling/swiping doesn't move the page down to the next section — it triggers a
   zoom: the current screen rushes toward you and fades, and the next screen is
   revealed already sitting there behind it, like zooming through a doorway.
   Used for the intro -> map handoff, and for the whole finale sequence.
   ========================================================= */

/* one "advance" gesture per wheel/swipe/key, ignoring the trailing repeats a single
   physical scroll gesture generates */
function makeGestureGate(cooldownMs){
  let busy = false;
  return function(handler){
    return function(e){
      if(busy) return;
      const result = handler(e);
      if(result === false) return; // handler declined (e.g. no delta)
      busy = true;
      setTimeout(()=>{ busy = false; }, cooldownMs);
    };
  };
}

/* a brief bright flash at the peak of a zoom, timed to the midpoint — this is what actually
   sells "passing through" into the next page; pure scale+fade alone reads flat without it */
function zoomFlash(){
  let el = document.getElementById('zoomFlash');
  if(!el){ el = document.createElement('div'); el.id = 'zoomFlash'; document.body.appendChild(el); }
  requestAnimationFrame(()=>{ el.style.opacity = '0.8'; });
  setTimeout(()=>{ el.style.opacity = '0'; }, 220);
}

/* ---------- intro -> map: one-shot zoom-through ---------- */
(function(){
  document.body.style.overflow = 'hidden';
  const intro = document.getElementById('intro');
  const introZoom = document.getElementById('introZoom');
  const scrollCue = document.getElementById('scrollCue');
  let done = false;

  function advance(){
    if(done) return;
    done = true;
    scrollCue.style.opacity = '0';
    introZoom.classList.add('zoom-exit');
    setTimeout(()=>{ intro.classList.add('zoom-exit'); }, 200);
    setTimeout(zoomFlash, 650);
    setTimeout(()=>{
      intro.style.display = 'none';
      window.scrollTo(0, 0);
      document.body.style.overflow = '';
      window.removeEventListener('wheel', onWheel);
      window.removeEventListener('touchstart', onTouchStart);
      window.removeEventListener('touchend', onTouchEnd);
      window.removeEventListener('keydown', onKey);
    }, 1450);
  }
  const gate = makeGestureGate(1550);
  const onWheel = gate((e)=>{ if(e.deltaY>0){ e.preventDefault(); advance(); } else return false; });
  let touchY = null;
  const onTouchStart = (e)=>{ touchY = e.touches[0].clientY; };
  const onTouchEnd = gate((e)=>{
    if(touchY==null) return false;
    const dy = touchY - e.changedTouches[0].clientY;
    touchY = null;
    if(dy>30){ advance(); } else return false;
  });
  const onKey = gate((e)=>{
    if(['ArrowDown','PageDown',' '].includes(e.key)){ advance(); } else return false;
  });
  window.addEventListener('wheel', onWheel, {passive:false});
  window.addEventListener('touchstart', onTouchStart, {passive:true});
  window.addEventListener('touchend', onTouchEnd, {passive:true});
  window.addEventListener('keydown', onKey);
})();

/* ---------- reusable zoom-through page deck (used by the finale) ---------- */
function createZoomDeck(pages){
  let idx = 0;
  let animating = false;

  pages.forEach((p,i)=>{
    if(i===0){
      p.style.display='flex'; p.style.zIndex='2';
      p.style.transform='scale(1)'; p.style.opacity='1';
    } else {
      p.style.display='none'; p.style.zIndex='1';
      p.style.transform='scale(0.72)'; p.style.opacity='0';
    }
  });

  function go(direction){
    const nextIdx = idx + direction;
    if(animating || nextIdx<0 || nextIdx>=pages.length) return false;
    animating = true;
    const cur = pages[idx], next = pages[nextIdx];
    next.style.display = 'flex';
    next.style.zIndex = '1';
    void next.offsetWidth; // force layout so the entry state applies before transitioning
    cur.style.zIndex = '2';
    requestAnimationFrame(()=>{
      cur.style.transform = direction>0 ? 'scale(3.4)' : 'scale(0.5)';
      cur.style.opacity = '0';
      next.style.transform = 'scale(1)';
      next.style.opacity = '1';
    });
    setTimeout(zoomFlash, 620);
    setTimeout(()=>{
      cur.style.display = 'none';
      idx = nextIdx;
      animating = false;
    }, 1350);
  }
  return { go };
}

  `));

    const qPage = buildFinalePage(`
      <h2 class="question-text">${q}</h2>

    qPage.querySelector('.yes-btn').addEventListener('click', ()=>{
      if(isLast){ spawnConfetti(); setTimeout(spawnConfetti, 500); }
      deckSeq.go(1);
    });
    pages.push(qPage);
  });

  const celebration = buildFinalePage(`
    <h2 class="script">${CONFIG.finale.celebration}</h2>
    <div class="collage-grid" id="collageGrid"></div>
  `);
  pages.push(celebration);

  pages.forEach(p=>deck.appendChild(p));

  CONFIG.levels.forEach((lvl,i)=>{
    pages[i+1].querySelector('.quality-photo').appendChild(photoFigure(lvl.photo));
  });
  const collageGrid = celebration.querySelector('#collageGrid');
  CONFIG.levels.forEach(lvl=> collageGrid.appendChild(photoFigure(lvl.photo, true)));

  const deckSeq = createZoomDeck(pages);
  const gate = makeGestureGate(1500);

  // if the active page's content is taller than the page (a long paragraph, say),
  // a scroll/swipe/key should scroll that content first — only once she's hit the
  // top or bottom of it does the gesture actually zoom to the next/prev page.
  function getActivePage(){ return pages.find(p=>p.style.display==='flex'); }
  function canScrollMore(page, dir){
    if(!page) return false;
    const overflow = page.scrollHeight - page.clientHeight;
    if(overflow<=1) return false;
    return dir>0 ? page.scrollTop < overflow-1 : page.scrollTop > 1;
  }

  function wheelHandler(e){
    const dir = e.deltaY>0 ? 1 : (e.deltaY<0 ? -1 : 0);
    if(dir===0) return false;
    if(canScrollMore(getActivePage(), dir)) return false; // let native scroll happen
    e.preventDefault();
    deckSeq.go(dir);
  }
  let touchY = null;
  function touchStart(e){ touchY = e.touches[0].clientY; }
  function touchEnd(e){
    if(touchY==null) return false;
    const dy = touchY - e.changedTouches[0].clientY;
    touchY = null;
    const dir = dy>30 ? 1 : (dy<-30 ? -1 : 0);
    if(dir===0) return false;
    if(canScrollMore(getActivePage(), dir)) return false; // she was just scrolling the text
    deckSeq.go(dir);
  }
  function keyHandler(e){
    const dir = ['ArrowDown','PageDown',' '].includes(e.key) ? 1
      : ['ArrowUp','PageUp'].includes(e.key) ? -1 : 0;
    if(dir===0) return false;
    const page = getActivePage();
    if(canScrollMore(page, dir)){ page.scrollBy({top: dir*280, behavior:'smooth'}); return false; }
    deckSeq.go(dir);
  }
  window.addEventListener('wheel', gate(wheelHandler), {passive:false});
  window.addEventListener('touchstart', touchStart, {passive:true});
  window.addEventListener('touchend', gate(touchEnd), {passive:true});
  window.addEventListener('keydown', gate(keyHandler));
}

/* ---------- helpers ---------- */
function makeCanvas(w,h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.style.width = '100%';
  c.style.maxWidth = w+'px';
  return c;
}
function canvasPoint(canvas, evt){
  const rect = canvas.getBoundingClientRect();
  const cx = (evt.touches ? evt.touches[0].clientX : evt.clientX);
  const cy = (evt.touches ? evt.touches[0].clientY : evt.clientY);
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return { x:(cx-rect.left)*scaleX, y:(cy-rect.top)*scaleY };
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ---------- LEVEL 1: Cuteness Monster (dino-jump) ---------- */
function startCuteness(mount, onWin){
  const W=600,H=260;
  const canvas = makeCanvas(W,H);
  mount.appendChild(canvas);
  const info = document.createElement('div');
  info.style.cssText='margin-top:10px;font-weight:700;color:#8a6b7a;';
  mount.appendChild(info);
  const ctx = canvas.getContext('2d');

  // ---- terrain is purely cosmetic here — gentle, mostly-flat rolling ground with the
  // occasional low plateau for a geometry-dash-ish look. It never causes a fail; the player
  // always auto-follows it (like a normal endless runner). The ONLY thing that ends a run
  // is touching a spike.
  //
  // Spikes are placed on specific terrain landmarks, not on a timer — one candidate spot per
  // ground segment (never two in the same stretch), and a chunk of segments get skipped
  // entirely so there's always real breathing room between them:
  //   - on a lower (flat) stretch: its midpoint
  //   - on a plateau: either its endpoint, or the point halfway between its middle and its end
  const TILE=26;
  const groundBase = H-20;
  const LOW=2, HIGH=3;
  let terrain = [];
  let obstacles = [];
  let terrainState = LOW;

  function addSegment(state, len, startX){
    for(let i=0;i<len;i++) terrain.push({x:startX+i*TILE, h:state});
    if(Math.random() < 0.55) return; // skip this segment's spike entirely — the breathing room
    let spikeX;
    if(state===LOW){
      spikeX = startX + Math.floor(len/2)*TILE;               // midpoint of the lower ramp
    } else {
      spikeX = Math.random()<0.5
        ? startX + (len-1)*TILE                                // endpoint of the top ramp
        : startX + Math.floor(len*0.75)*TILE;                  // midpoint between the plateau's middle and its end
    }
    obstacles.push({x:spikeX, w:24, h:26+Math.random()*10, baseY: groundBase-state*TILE});
  }
  function appendNextSegment(){
    terrainState = terrainState===LOW ? HIGH : LOW;
    const len = terrainState===LOW ? (14+Math.floor(Math.random()*8)) : (6+Math.floor(Math.random()*4));
    const startX = terrain.length ? terrain[terrain.length-1].x+TILE : 0;
    addSegment(terrainState, len, startX);
  }
  function seedTerrain(){
    terrain = []; obstacles = []; terrainState = LOW;
    for(let i=0;i<8;i++) terrain.push({x:i*TILE, h:LOW}); // safe runway, no spikes
    while(terrain.length*TILE < W*2) appendNextSegment();
  }
  function colHeightAt(x){
    const c = terrain.find(c=>c.x<=x && c.x+TILE>x);
    return c ? c.h : LOW;
  }
  seedTerrain();

  let player = { x:70, y:groundBase-LOW*TILE-44, w:44, h:44, vy:0, jumping:false, rotation:0 };
  // snappier arc than a floaty jump — same max height, ~35% quicker up-and-down — so a
  // spacebar press reads as instant rather than sluggish
  const GRAVITY=0.74, JUMP_V=-15.0;
  let survived=0, speed=4.4;
  let running=true, invuln=0, tryAgain=0;
  let worldX=0;
  let jumpBuffer=0; // a press slightly before landing is remembered and fires the instant you land
  const WIN_TIME=10; // seconds of active survival needed

  function jump(){
    if(!player.jumping){ player.vy = JUMP_V; player.jumping = true; jumpBuffer=0; }
    else { jumpBuffer = 0.16; }
  }
  function keyHandler(e){ if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); jump(); } }
  function clickHandler(){ jump(); }
  window.addEventListener('keydown', keyHandler);
  canvas.addEventListener('mousedown', clickHandler);
  canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); jump(); });

  function failRun(){
    tryAgain = 1.1; invuln = 1.0;
    survived = 0; speed = 4.4;
    seedTerrain();
    player.y = groundBase-LOW*TILE-player.h; player.vy=0; player.jumping=false; player.rotation=0; jumpBuffer=0;
  }

  let lastTime = performance.now();
  function loop(now){
    if(!running) return;
    const dt = Math.min(now-lastTime, 50); lastTime = now;
    const frameScale = dt/16.6667;
    const scrollPx = speed * frameScale;
    ctx.clearRect(0,0,W,H);
    // sky
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#eaf6ff'); g.addColorStop(1,'#fdf3f7');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,220,150,0.9)'; ctx.beginPath(); ctx.arc(W-60,50,26,0,7); ctx.fill();
    // faint geometry-dash style background grid
    worldX -= scrollPx;
    ctx.strokeStyle='rgba(183,156,255,0.14)'; ctx.lineWidth=1;
    const grid=40;
    for(let gx = -(worldX*0.6)%grid; gx<W; gx+=grid){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
    for(let gy=0; gy<H; gy+=grid){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }
    // soft parallax hills
    ctx.fillStyle='rgba(230,215,255,0.4)';
    for(let i=0;i<3;i++){
      const hx = ((worldX*0.5)+i*220) % (W+200) - 100;
      ctx.beginPath(); ctx.arc(hx,H-4,70,Math.PI,0); ctx.fill();
    }

    // scroll terrain and its landmark-placed spikes together, keep the queue topped up
    // ahead and pruned behind
    terrain.forEach(c=>c.x -= scrollPx);
    terrain = terrain.filter(c=>c.x+TILE > -40);
    obstacles.forEach(o=>o.x -= scrollPx);
    obstacles = obstacles.filter(o=>o.x> -40);
    while(terrain.length===0 || terrain[terrain.length-1].x+TILE < W+TILE) appendNextSegment();
    speed = 4.4 + survived*0.08; // a gentle ramp so it builds a little, not a flat 20s

    // physics — the ground always just catches you; no fail condition lives here at all
    // (scaled by frameScale so the arc plays at the same real-world speed regardless of
    // the browser/display's actual frame rate — this is what made jumps fly by way too
    // fast on high-refresh-rate Chrome setups when it was left unscaled)
    player.vy += GRAVITY*frameScale;
    player.y += player.vy*frameScale;
    if(player.jumping) player.rotation += dt*0.006;
    const feetY = player.y + player.h;
    const surfaceY = groundBase - colHeightAt(player.x + player.w*0.5)*TILE;
    if(jumpBuffer>0) jumpBuffer -= dt/1000;
    if(feetY>=surfaceY && player.vy>=0){
      player.y = surfaceY - player.h; player.vy=0;
      if(player.jumping){
        player.jumping=false; player.rotation = Math.round(player.rotation/(Math.PI/2))*(Math.PI/2);
        if(jumpBuffer>0){ jumpBuffer=0; player.vy=JUMP_V; player.jumping=true; } // buffered press fires the instant we land
      }
    }

    if(invuln>0) invuln -= dt/1000;
    if(tryAgain>0) tryAgain -= dt/1000;

    if(invuln<=0){
      obstacles.forEach(o=>{
        const oy = o.baseY - o.h;
        const hitX = player.x < o.x+o.w-8 && player.x+player.w-8 > o.x;
        const hitY = player.y+player.h > oy+7;
        if(hitX && hitY) failRun();
      });
    }

    if(tryAgain<=0) survived += dt/1000;

    // terrain (geometry-dash style tiered blocks with a grassy top edge)
    terrain.forEach(c=>{
      const surfY = groundBase - c.h*TILE;
      ctx.fillStyle = Math.floor(c.x/TILE)%2===0 ? '#d9c7f5' : '#e9def5';
      ctx.fillRect(c.x, surfY, TILE+1, H-surfY);
      ctx.fillStyle = '#7ed99b';
      ctx.fillRect(c.x, surfY, TILE+1, 6);
      ctx.fillStyle = '#5fc082';
      ctx.fillRect(c.x, surfY+6, TILE+1, 2);
    });

    // spikes (grumpy little triangles)
    obstacles.forEach(o=>{
      const oy = o.baseY - o.h;
      ctx.fillStyle='#b79cff';
      ctx.beginPath();
      ctx.moveTo(o.x, o.baseY);
      ctx.lineTo(o.x+o.w/2, oy);
      ctx.lineTo(o.x+o.w, o.baseY);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#7a5c9e'; ctx.lineWidth=2; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(o.x+o.w*0.3,oy+o.h*0.55); ctx.lineTo(o.x+o.w*0.42,oy+o.h*0.45); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(o.x+o.w*0.7,oy+o.h*0.55); ctx.lineTo(o.x+o.w*0.58,oy+o.h*0.45); ctx.stroke();
    });

    // draw player (cute round monster, rotating mid-air like a GD cube)
    const px=player.x+player.w/2, py=player.y+player.h/2;
    ctx.save();
    ctx.translate(px,py); ctx.rotate(player.rotation); ctx.translate(-player.w/2,-player.h/2);
    if(invuln>0 && Math.floor(invuln*10)%2===0) ctx.globalAlpha=0.4;
    ctx.fillStyle='#ff8fab';
    roundRect(ctx, 0, 0, player.w, player.h, 16); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(14,18,6,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(30,18,6,0,7); ctx.fill();
    ctx.fillStyle='#4a2c3d';
    ctx.beginPath(); ctx.arc(15,19,2.6,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(31,19,2.6,0,7); ctx.fill();
    ctx.strokeStyle='#e14577'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(22,27,7,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    ctx.fillStyle='#ffb6c1';
    ctx.beginPath(); ctx.arc(8,26,3,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(36,26,3,0,7); ctx.fill();
    ctx.restore();

    if(tryAgain>0){
      info.style.color = '#e14577';
      info.textContent = 'Try again! 💗';
    } else {
      info.style.color = '#8a6b7a';
      info.textContent = `Survived ${Math.floor(survived)}s / ${WIN_TIME}s`;
    }

    if(survived>=WIN_TIME){ running=false; cleanup(); onWin(); return; }
    raf = requestAnimationFrame(loop);
  }
  let raf = requestAnimationFrame(loop);
  function cleanup(){
    running=false;
    cancelAnimationFrame(raf);
    window.removeEventListener('keydown', keyHandler);
  }
  return cleanup;
}

/* ---------- LEVEL 2: Humour ("Catch the Giggles") ---------- */
function startHumour(mount, onWin){
  const wrap = document.createElement('div');
  wrap.style.cssText='position:relative;width:100%;max-width:600px;height:360px;background:linear-gradient(160deg,#fff6f8,#f3ecff);border-radius:14px;overflow:hidden;';
  mount.appendChild(wrap);
  const info = document.createElement('div');
  info.style.cssText='margin-top:10px;font-weight:700;color:#8a6b7a;';
  mount.appendChild(info);

  const FUNNY=['😂','🤣','😆','😹'];
  const DECOY=['😐','📄','📎','🧾'];
  let score=0, running=true;
  const WIN_SCORE=12;

  function spawn(){
    if(!running) return;
    const isFunny = Math.random()<0.7;
    const el = document.createElement('div');
    el.textContent = isFunny ? FUNNY[Math.floor(Math.random()*FUNNY.length)] : DECOY[Math.floor(Math.random()*DECOY.length)];
    el.style.cssText = `position:absolute;top:-40px;left:${5+Math.random()*85}%;font-size:32px;cursor:pointer;user-select:none;transition:top linear;`;
    const duration = 3.5+Math.random()*2;
    wrap.appendChild(el);
    requestAnimationFrame(()=>{
      el.style.transition = `top ${duration}s linear`;
      el.style.top = '380px';
    });
    const fallTimeout = setTimeout(()=>{ el.remove(); }, duration*1000+50);
    el.addEventListener('click', ()=>{
      clearTimeout(fallTimeout);
      if(isFunny){
        score++;
        floatText(wrap, el.offsetLeft, 'left', '+1 😂');
      }else{
        score=Math.max(0,score-1);
        el.style.filter='brightness(0.7)';
      }
      el.remove();
      info.textContent = `Laughs collected: ${score} / ${WIN_SCORE}`;
      if(score>=WIN_SCORE){ finish(); }
    });
  }
  function floatText(parent,left,unit,text){
    const t=document.createElement('div');
    t.textContent=text;
    t.style.cssText=`position:absolute;top:300px;left:${left}px;font-weight:800;color:#ff5d8f;pointer-events:none;transition:top 0.8s ease, opacity 0.8s ease;`;
    parent.appendChild(t);
    requestAnimationFrame(()=>{ t.style.top='260px'; t.style.opacity='0'; });
    setTimeout(()=>t.remove(),850);
  }
  info.textContent = `Laughs collected: 0 / ${WIN_SCORE}`;
  const interval = setInterval(spawn, 750);
  let finished=false;
  function finish(){
    if(finished) return;
    finished=true; running=false;
    clearInterval(interval);
    wrap.querySelectorAll('div').forEach(d=>d.remove());
    onWin();
  }
  return function cleanup(){ running=false; finished=true; clearInterval(interval); };
}

/* ---------- LEVEL 3: Optimism ("Catch the Sunshine") ---------- */
function startOptimism(mount, onWin){
  const W=600,H=300;
  const canvas = makeCanvas(W,H);
  mount.appendChild(canvas);
  const info = document.createElement('div');
  info.style.cssText='margin-top:10px;font-weight:700;color:#8a6b7a;';
  mount.appendChild(info);
  const ctx = canvas.getContext('2d');

  let basketX = W/2, basketW=80;
  let items=[]; let score=0, running=true, tryAgain=0;
  const WIN_SCORE=15;
  let spawnTimer=0, nextSpawn=45;

  function moveHandler(e){
    const p = canvasPoint(canvas, e);
    basketX = Math.max(basketW/2, Math.min(W-basketW/2, p.x));
  }
  canvas.addEventListener('mousemove', moveHandler);
  canvas.addEventListener('touchmove', (e)=>{ e.preventDefault(); moveHandler(e); }, {passive:false});
  const keys={};
  function keydown(e){ keys[e.code]=true; }
  function keyup(e){ keys[e.code]=false; }
  window.addEventListener('keydown', keydown);
  window.addEventListener('keyup', keyup);

  function drawStar(cx,cy,r,color){
    ctx.fillStyle=color;
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const ang = Math.PI/5*i - Math.PI/2;
      const rad = i%2===0? r : r*0.45;
      const x=cx+Math.cos(ang)*rad, y=cy+Math.sin(ang)*rad;
      i===0? ctx.moveTo(x,y): ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.fill();
  }
  function drawCloud(cx,cy,r,color){
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.arc(cx-r*0.6,cy,r*0.6,0,7);
    ctx.arc(cx,cy-r*0.3,r*0.75,0,7);
    ctx.arc(cx+r*0.6,cy,r*0.6,0,7);
    ctx.arc(cx,cy+r*0.2,r*0.8,0,7);
    ctx.fill();
  }

  function loop(){
    if(!running) return;
    ctx.clearRect(0,0,W,H);
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#cdeeff'); g.addColorStop(1,'#fff6f8');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    if(keys['ArrowLeft']) basketX = Math.max(basketW/2, basketX-6);
    if(keys['ArrowRight']) basketX = Math.min(W-basketW/2, basketX+6);

    spawnTimer++;
    if(spawnTimer>nextSpawn){
      spawnTimer=0; nextSpawn=40+Math.random()*35;
      const good = Math.random()<0.72;
      items.push({x:20+Math.random()*(W-40), y:-20, v:2.4+Math.random()*1.6, good});
    }
    items.forEach(it=> it.y += it.v);

    const basketY = H-36;
    items.forEach(it=>{
      if(!it.done && it.y > basketY-14 && it.y < basketY+18 && Math.abs(it.x-basketX) < basketW/2){
        it.done=true;
        if(it.good){ score++; } else { tryAgain=1.1; score=0; }
      }
    });
    items = items.filter(it=> !it.done && it.y < H+30);

    items.forEach(it=>{
      if(it.good) drawStar(it.x,it.y,14,'#ffcf6b');
      else drawCloud(it.x,it.y,14,'#9fb3c8');
    });

    // basket (cloud shape)
    drawCloud(basketX, basketY, 24, '#ffb6c1');

    if(tryAgain>0){
      tryAgain -= 1/60;
      info.style.color = '#e14577';
      info.textContent = 'Try again! 💗';
      items = [];
    } else {
      info.style.color = '#8a6b7a';
      info.textContent = `Sunshine caught: ${score} / ${WIN_SCORE}`;
    }

    if(score>=WIN_SCORE){ running=false; cleanup(); onWin(); return; }
    raf = requestAnimationFrame(loop);
  }
  let raf = requestAnimationFrame(loop);
  function cleanup(){
    running=false;
    cancelAnimationFrame(raf);
    window.removeEventListener('keydown', keydown);
    window.removeEventListener('keyup', keyup);
  }
  return cleanup;
}

/* ---------- LEVEL 4: Empathy (memory match) ---------- */
function startEmpathy(mount, onWin){
  const ICONS=['❤️','🤗','😢','😊','🥹','🙏','🌈','✨'];
  let deck = [...ICONS, ...ICONS];
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }

  const grid = document.createElement('div');
  grid.style.cssText='display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;width:100%;';
  mount.appendChild(grid);
  const info = document.createElement('div');
  info.style.cssText='margin-top:12px;font-weight:700;color:#8a6b7a;';
  mount.appendChild(info);

  let flipped=[]; let matched=0; let lock=false; let moves=0;

  deck.forEach((val, idx)=>{
    const card = document.createElement('button');
    card.style.cssText=`aspect-ratio:1/1;border-radius:12px;font-size:26px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#e6d7ff,#ffd1dc);color:transparent;transition:transform .3s;box-shadow:0 4px 10px rgba(0,0,0,0.12);`;
    card.dataset.val = val;
    card.dataset.idx = idx;
    card.addEventListener('click', ()=>{
      if(lock || card.classList.contains('matched') || flipped.includes(card)) return;
      reveal(card);
      flipped.push(card);
      if(flipped.length===2){
        moves++; lock=true;
        const [a,b]=flipped;
        if(a.dataset.val===b.dataset.val){
          a.classList.add('matched'); b.classList.add('matched');
          matched++; flipped=[]; lock=false;
          info.textContent = `Pairs found: ${matched} / 8`;
          if(matched===8){ setTimeout(()=>onWin(),350); }
        }else{
          setTimeout(()=>{
            hide(a); hide(b);
            flipped=[]; lock=false;
          },700);
        }
      }
    });
    grid.appendChild(card);
  });
  function reveal(card){ card.textContent = card.dataset.val; card.style.color='#4a2c3d'; card.style.background='#fff'; }
  function hide(card){ card.textContent=''; card.style.color='transparent'; card.style.background='linear-gradient(160deg,#e6d7ff,#ffd1dc)'; }

  info.textContent = `Pairs found: 0 / 8`;
  return function cleanup(){};
}

/* ---------- LEVEL 5: Loyalty ("Never Leaves Your Side") ---------- */
function startLoyalty(mount, onWin){
  const W=600,H=300;
  const canvas = makeCanvas(W,H);
  mount.appendChild(canvas);
  const barWrap = document.createElement('div');
  barWrap.style.cssText='width:100%;max-width:600px;height:16px;background:#f0e4ea;border-radius:10px;margin-top:12px;overflow:hidden;';
  const bar = document.createElement('div');
  bar.style.cssText='height:100%;width:0%;background:linear-gradient(90deg,#ff8fab,#ff5d8f);transition:width .1s linear;';
  barWrap.appendChild(bar);
  mount.appendChild(barWrap);
  const info = document.createElement('div');
  info.style.cssText='margin-top:8px;font-weight:700;color:#8a6b7a;';
  mount.appendChild(info);
  const ctx = canvas.getContext('2d');

  let px=W/2, py=H/2;
  let running=true, t=0, progress=0;
  const TARGET=12; // seconds-equivalent inside the zone
  const zoneR=52;

  function moveHandler(e){
    const p = canvasPoint(canvas, e);
    px = p.x; py = p.y;
  }
  canvas.addEventListener('mousemove', moveHandler);
  canvas.addEventListener('touchmove', (e)=>{ e.preventDefault(); moveHandler(e); }, {passive:false});
  const keys={};
  function keydown(e){ keys[e.code]=true; }
  function keyup(e){ keys[e.code]=false; }
  window.addEventListener('keydown', keydown);
  window.addEventListener('keyup', keyup);

  function drawHeart(cx,cy,size,color){
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.moveTo(cx,cy+size*0.3);
    ctx.bezierCurveTo(cx-size,cy-size*0.6, cx-size*0.4,cy-size*1.3, cx,cy-size*0.4);
    ctx.bezierCurveTo(cx+size*0.4,cy-size*1.3, cx+size,cy-size*0.6, cx,cy+size*0.3);
    ctx.closePath(); ctx.fill();
  }

  let lastTime=performance.now();
  function loop(now){
    if(!running) return;
    const dt = Math.min(now-lastTime,50); lastTime=now;
    t += dt/1000;

    if(keys['ArrowLeft']) px-=4; if(keys['ArrowRight']) px+=4;
    if(keys['ArrowUp']) py-=4; if(keys['ArrowDown']) py+=4;
    px = Math.max(10,Math.min(W-10,px)); py=Math.max(10,Math.min(H-10,py));

    const zx = W/2 + Math.sin(t*0.6)*180;
    const zy = H/2 + Math.cos(t*0.9)*90;

    ctx.clearRect(0,0,W,H);
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#fff0f5'); g.addColorStop(1,'#f3ecff');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    const glow = ctx.createRadialGradient(zx,zy,0,zx,zy,zoneR);
    glow.addColorStop(0,'rgba(255,143,171,0.55)');
    glow.addColorStop(1,'rgba(255,143,171,0)');
    ctx.fillStyle=glow;
    ctx.beginPath(); ctx.arc(zx,zy,zoneR,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,93,143,0.6)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(zx,zy,zoneR,0,7); ctx.stroke();

    const dist = Math.hypot(px-zx, py-zy);
    const inside = dist < zoneR;
    if(inside) progress += dt/1000;
    else progress = Math.max(0, progress - dt/2500);

    drawHeart(px,py,16, inside? '#ff5d8f':'#c98aa3');

    const pct = Math.min(100, (progress/TARGET)*100);
    bar.style.width = pct+'%';
    info.textContent = inside ? "Right where you belong ✨" : "Stay close...";

    if(progress>=TARGET){ running=false; cleanup(); onWin(); return; }
    raf = requestAnimationFrame(loop);
  }
  let raf = requestAnimationFrame(loop);
  function cleanup(){
    running=false;
    cancelAnimationFrame(raf);
    window.removeEventListener('keydown', keydown);
    window.removeEventListener('keyup', keyup);
  }
  return cleanup;
}
